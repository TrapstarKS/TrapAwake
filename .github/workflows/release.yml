name: TrapAwake Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/TrapAwake-Info.plist)
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/v$version" ]]; then
            echo "Tag and bundle version differ" >&2
            exit 1
          fi
      - run: swift test
      - run: swift build -c release --product TrapAwake -Xswiftc -warnings-as-errors
      - run: scripts/package-trapawake.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TrapAwake-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TrapAwake-release
          path: release
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          if existing=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .target_commitish 2>/dev/null); then
            [[ "$existing" == "$SOURCE_COMMIT" ]] || { echo "Existing release names another source commit" >&2; exit 1; }
            echo "This source commit already has a published release; keeping its immutable assets."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Native rootless keep-awake for Apple Silicon, macOS 26+.
          Unlimited and timed sessions, separate display control, battery and thermal safeguards.
          Left-click for inline days/hours/minutes; right-click for the native session menu.
          Install: open the DMG, drag TrapAwake to Applications, then open the app. No terminal command or checksum file is required.
          Ad-hoc signed. Not Developer ID signed or notarized. SHA256SUMS is optional download-integrity information.
          Independent fork of krishhgg/Insomnia; MIT notices and original history preserved.
          See README and CHANGELOG in the repository for installation, limitations, and credits.
          NOTES
          gh release create "$RELEASE_TAG" ./*.zip ./*.dmg SHA256SUMS --verify-tag --target "$SOURCE_COMMIT" --title "TrapAwake $RELEASE_TAG" --notes-file notes.md
